<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychiatry</title>
<style>
  :root{
    --ink:#12292b;
    --ink-soft:#3d5a5c;
    --paper:#eef3f2;
    --paper-card:#ffffff;
    --line:#d7e2e0;
    --teal:#1f6f73;
    --teal-dark:#0f3a3d;
    --teal-pale:#e2eeed;
    --amber:#c98a2c;
    --amber-pale:#faf1de;
    --red:#b5473f;
    --red-pale:#f8e6e4;
    --green:#4a7c59;
    --green-pale:#e7f0e8;
    --radius:10px;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
  }
  #app{display:flex;height:100vh;overflow:hidden;background:var(--paper);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:320px;min-width:280px;
    background:var(--paper-card);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  #brand{
    padding:20px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  #brand .mark{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    color:var(--teal-dark);
    letter-spacing:0.2px;
  }
  #brand .sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:0.4px;
    text-transform:uppercase;
  }
  #search-wrap{padding:12px 14px;border-bottom:1px solid var(--line);}
  #search-input{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--sans);font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  #search-input:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  #clinic-filter{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px;border-bottom:1px solid var(--line);}
  .clinic-pill{
    padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .clinic-pill:hover{border-color:var(--teal);color:var(--teal-dark);}
  .clinic-pill.active{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
  #patient-count{padding:8px 14px 0;font-size:11.5px;color:var(--ink-soft);}
  #patient-list{flex:1;min-height:0;overflow-y:auto;padding:6px 8px;}
  .patient-item{
    padding:10px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;
  }
  .patient-item:hover{background:var(--teal-pale);}
  .patient-item.active{background:var(--teal-pale);border-color:var(--teal);}
  .patient-item .pname{font-weight:600;font-size:13.5px;color:var(--ink);}
  .patient-item .pmeta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .patient-item .pflag{
    display:inline-block;margin-top:5px;font-size:10px;padding:1px 7px;border-radius:20px;
    background:var(--red-pale);color:var(--red);font-weight:600;
  }
  #add-patient-btn{
    margin:10px 14px 14px;padding:10px;border:none;border-radius:8px;
    background:var(--teal-dark);color:#fff;font-weight:600;font-size:13px;cursor:pointer;
    font-family:var(--sans);
  }
  #add-patient-btn:hover{background:var(--teal);}

  /* ---------- Main ---------- */
  #main{flex:1;overflow-y:auto;padding:26px 34px 60px;background:var(--paper);}
  #empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:80%;color:var(--ink-soft);text-align:center;
  }
  #empty-state .mark{font-family:var(--serif);font-size:30px;color:var(--teal-dark);margin-bottom:8px;}

  .ph-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .ph-title{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--teal-dark);}
  .ph-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .ph-id{font-size:11px;color:var(--ink-soft);font-family:monospace;}
  .ph-actions{display:flex;gap:8px;}
  .btn{
    padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;
    font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  .btn:hover{border-color:var(--teal);color:var(--teal-dark);}
  .btn-primary{background:var(--teal-dark);color:#fff;border-color:var(--teal-dark);}
  .btn-primary:hover{background:var(--teal);border-color:var(--teal);}
  .btn-danger{color:var(--red);}
  .btn-danger:hover{border-color:var(--red);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tab{
    padding:9px 4px;margin-right:18px;font-size:13px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--teal-dark);border-bottom-color:var(--teal-dark);}

  .card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:16px;
  }
  .card h3{
    font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--teal-dark);
    margin:0 0 12px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;}
  .field{margin-bottom:2px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;color:var(--ink-soft);margin-bottom:3px;}
  .field .val{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .field .val.empty{color:#a9b8b6;font-style:italic;}
  .field.full{grid-column:1 / -1;}

  /* timeline */
  .timeline-entry{display:flex;gap:14px;margin-bottom:16px;}
  .timeline-dot-col{display:flex;flex-direction:column;align-items:center;}
  .timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:5px;}
  .timeline-line{flex:1;width:1px;background:var(--line);margin-top:2px;}
  .timeline-body{flex:1;padding-bottom:2px;}
  .timeline-date{font-size:12px;font-weight:700;color:var(--teal-dark);}
  .timeline-note{font-size:13px;color:var(--ink);margin-top:4px;white-space:pre-wrap;line-height:1.55;}
  .timeline-med{font-size:12px;color:var(--ink-soft);margin-top:6px;background:var(--paper);padding:6px 10px;border-radius:6px;}

  /* scales */
  .scale-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .scale-btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px 12px;cursor:pointer;text-align:left;
  }
  .scale-btn:hover{border-color:var(--teal);background:var(--teal-pale);}
  .scale-btn .sname{font-weight:700;font-size:14px;color:var(--teal-dark);}
  .scale-btn .sfull{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}

  .score-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .score-table th{text-align:left;padding:7px 10px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;}
  .score-table td{padding:9px 10px;border-bottom:1px solid var(--line);}
  .score-table tr:last-child td{border-bottom:none;}
  .score-row{cursor:pointer;}
  .score-row:hover td{background:var(--teal-pale);}
  .sq-opt-ro{cursor:default;}
  .sq-opt-ro:not(.picked){opacity:0.45;}

  /* Y-BOCS-II Có/Không */
  .yb-check-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .yb-check-text{font-size:12.5px;color:var(--ink);line-height:1.45;flex:1;min-width:220px;}
  .yb-check-opts{display:flex;gap:7px;flex-shrink:0;}
  .yb-opt{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-soft);white-space:nowrap;}
  .yb-opt:hover{border-color:var(--teal);}
  .yb-opt.picked{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
  .yb-opt-ro{cursor:default;}
  .yb-opt-ro:hover{border-color:var(--line);}
  .yb-opt-ro:not(.picked){opacity:0.45;}
  .level-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .lv-0{background:var(--green-pale);color:var(--green);}
  .lv-1{background:var(--amber-pale);color:var(--amber);}
  .lv-2{background:#fbe3cf;color:#a15b1f;}
  .lv-3{background:var(--red-pale);color:var(--red);}
  .lv-4{background:#4a1f1c;color:#fff;}

  .trend-wrap{margin-top:6px;}
  .trend-svg{width:100%;height:60px;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,58,61,0.35);display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:100;
    -webkit-transform:translateZ(0);transform:translateZ(0);-webkit-overflow-scrolling:touch;
  }
  .modal{
    background:#fff;border-radius:12px;max-width:640px;width:100%;padding:26px 28px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
  }
  .modal-overlay-fullscreen{padding:0;align-items:stretch;background:#fff;}
  .modal-fullscreen{
    max-width:none;width:100%;min-height:100vh;min-height:100dvh;border-radius:0;
    padding:26px clamp(16px, 6vw, 80px) 40px;
    background:#fff;box-shadow:none;
  }
  .modal h2{font-family:var(--serif);font-size:20px;color:var(--teal-dark);margin:0 0 4px;}
  .modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:18px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.2px;}
  .form-row input, .form-row select, .form-row textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-family:var(--sans);font-size:13.5px;
    background:var(--paper);color:var(--ink);
  }
  .form-row textarea{resize:vertical;min-height:60px;font-family:var(--sans);}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* scale form */
  .sq{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .sq:last-of-type{border-bottom:none;}
  .sq-text{font-size:13.5px;color:var(--ink);margin-bottom:9px;line-height:1.5;}
  .sq-options{display:flex;flex-wrap:wrap;gap:7px;}
  .sq-opt{
    padding:7px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;
    background:#fff;color:var(--ink);
  }
  .sq-opt.picked{background:var(--teal-dark);border-color:var(--teal-dark);color:#fff;}
  .risk-banner{
    background:var(--red-pale);color:var(--red);border:1px solid #e3b6b2;border-radius:8px;padding:10px 14px;
    font-size:12.5px;font-weight:600;margin:14px 0;
  }
  .score-preview{
    position:sticky;bottom:-22px;background:#fff;border-top:1px solid var(--line);padding:14px 0 4px;margin-top:6px;
  }
  .score-preview .big{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--teal-dark);}

  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--teal-dark);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:200;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c3d3d1;border-radius:4px;}

  @media (max-width:800px){
    #sidebar{position:fixed;inset:0;z-index:50;transform:translateX(-100%);transition:transform .2s;width:100%;}
    #sidebar.open{transform:translateX(0);}
    #main{padding:18px 16px 60px;}
    .field-grid{grid-template-columns:1fr;}
    .form-2col{grid-template-columns:1fr;}
    #mobile-back{display:inline-block !important;}
  }
  #mobile-back{display:none;margin-bottom:14px;}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f3a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Psychiatry">
<link rel="apple-touch-icon" href="icon-180.png">

</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand">
      <div class="mark">Psychiatry</div>
      <div class="sub">Theo dõi điều trị &amp; thang đo</div>
      <div id="offline-badge" style="margin-top:8px;font-size:10.5px;color:var(--green);font-weight:700;">● OFFLINE READY</div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <button id="import-data-btn" class="btn" style="padding:6px 9px;font-size:11px;">Nhập dữ liệu</button>
        <button id="backup-data-btn" class="btn" style="padding:6px 9px;font-size:11px;">Backup mã hóa</button>
        <button id="restore-data-btn" class="btn" style="padding:6px 9px;font-size:11px;">Khôi phục</button>
        <button id="clean-empty-btn" class="btn" style="padding:6px 9px;font-size:11px;">Dọn bệnh nhân trống</button>
      </div>
      <input id="import-file" type="file" accept="application/json,.json" style="display:none">
      <input id="restore-file" type="file" accept="application/json,.psybackup" style="display:none">
    </div>
    <button id="add-patient-btn">+ Thêm bệnh nhân</button>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Tìm bệnh nhân theo tên, SĐT..." />
    </div>
    <div id="clinic-filter"></div>
    <div id="patient-count"></div>
    <div id="patient-list"></div>
  </div>
  <div id="main"></div>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   DATA
========================================================= */
const SEED_PATIENTS = [];
const SEED_DASS21 = {}; // dữ liệu được import cục bộ trên iPad
const CLINICS = ['FV', 'Vạn Hạnh', 'Online', 'Tự do'];

/* Scale definitions */
const OPT4 = [
  {v:0,l:'Không có'},
  {v:1,l:'Vài ngày'},
  {v:2,l:'Hơn nửa số ngày'},
  {v:3,l:'Gần như mỗi ngày'}
];
const OPT_DASS = [
  {v:0,l:'Không áp dụng cho tôi chút nào / Did not apply to me at all'},
  {v:1,l:'Áp dụng một phần, hoặc đôi khi / Applied to some degree, or some of the time'},
  {v:2,l:'Áp dụng đáng kể, hoặc phần lớn thời gian / Applied to a considerable degree, or a good part of time'},
  {v:3,l:'Áp dụng rất nhiều, hoặc hầu hết thời gian / Applied to me very much, or most of the time'}
];
const OPT_YESNO = [
  {v:0,l:'Không / No'},
  {v:1,l:'Có / Yes'}
];
const OPT_CAARS = [
  {v:0,l:'Hoàn toàn không, không bao giờ / Not at all, never'},
  {v:1,l:'Một chút, thỉnh thoảng / Just a little, once in a while'},
  {v:2,l:'Khá nhiều, thường xuyên / Pretty much, often'},
  {v:3,l:'Rất nhiều, rất thường xuyên / Very much, very frequently'}
];

function ham(max, extra){ return {max, opts: Array.from({length:max+1},(_,i)=>({v:i,l:String(i)}))}; }

const SCALES = {
  phq9:{
    key:'phq9', name:'PHQ-9', full:'Patient Health Questionnaire-9 — Trầm cảm',
    instructions:'Trong 2 tuần vừa qua, bạn có thường xuyên bị làm phiền bởi những vấn đề sau?',
    items:[
      {t:'Ít hứng thú hoặc không còn thích thú làm việc gì', opts:OPT4},
      {t:'Cảm thấy buồn, chán nản, hoặc tuyệt vọng', opts:OPT4},
      {t:'Khó ngủ, ngủ không sâu giấc, hoặc ngủ quá nhiều', opts:OPT4},
      {t:'Cảm thấy mệt mỏi hoặc ít năng lượng', opts:OPT4},
      {t:'Ăn không ngon miệng hoặc ăn quá nhiều', opts:OPT4},
      {t:'Cảm thấy tệ về bản thân — hoặc cảm thấy mình thất bại, làm gia đình thất vọng', opts:OPT4},
      {t:'Khó tập trung vào việc gì đó, ví dụ đọc báo hoặc xem TV', opts:OPT4},
      {t:'Di chuyển/nói chậm đến mức người khác nhận thấy — hoặc ngược lại, bồn chồn hơn bình thường', opts:OPT4},
      {t:'Có ý nghĩ muốn chết hoặc tự làm hại bản thân theo cách nào đó', opts:OPT4, risk:true}
    ],
    levels:[[4,'Tối thiểu',0],[9,'Nhẹ',1],[14,'Trung bình',2],[19,'Trung bình nặng',3],[27,'Nặng',4]]
  },
  gad7:{
    key:'gad7', name:'GAD-7', full:'Generalized Anxiety Disorder-7 — Lo âu',
    instructions:'Trong 2 tuần vừa qua, bạn có thường xuyên bị làm phiền bởi những vấn đề sau?',
    items:[
      {t:'Cảm thấy lo lắng, bồn chồn, hoặc căng thẳng', opts:OPT4},
      {t:'Không thể ngừng lo lắng hoặc kiểm soát sự lo lắng', opts:OPT4},
      {t:'Lo lắng quá nhiều về những việc khác nhau', opts:OPT4},
      {t:'Khó thư giãn', opts:OPT4},
      {t:'Bồn chồn đến mức khó ngồi yên', opts:OPT4},
      {t:'Dễ bực bội hoặc cáu gắt', opts:OPT4},
      {t:'Cảm thấy sợ hãi như thể điều gì đó khủng khiếp sắp xảy ra', opts:OPT4}
    ],
    levels:[[4,'Tối thiểu',0],[9,'Nhẹ',1],[14,'Trung bình',2],[21,'Nặng',3]]
  },
  dass21:{
    key:'dass21', name:'DASS-21', full:'Depression Anxiety Stress Scales-21',
    instructions:'Đọc mỗi câu và chọn mức độ áp dụng cho bạn trong TUẦN VỪA QUA. Không có câu trả lời đúng hay sai. / Please read each statement and select how much it applied to you over the past week. There are no right or wrong answers.',
    subscale:true,
    items:[
      {t:'1. Tôi cảm thấy khó để thư giãn / I found it hard to wind down', opts:OPT_DASS, sub:'stress'},
      {t:'2. Tôi nhận thấy miệng mình bị khô / I was aware of dryness of my mouth', opts:OPT_DASS, sub:'anxiety'},
      {t:'3. Tôi dường như không thể cảm nhận được bất kỳ cảm xúc tích cực nào / I couldn’t seem to experience any positive feeling at all', opts:OPT_DASS, sub:'depression'},
      {t:'4. Tôi gặp khó khăn khi thở (ví dụ: thở nhanh quá mức, khó thở mà không do gắng sức) / I experienced breathing difficulty (e.g. excessively rapid breathing, breathlessness in the absence of physical exertion)', opts:OPT_DASS, sub:'anxiety'},
      {t:'5. Tôi thấy khó khăn để bắt đầu làm việc gì đó / I found it difficult to work up the initiative to do things', opts:OPT_DASS, sub:'depression'},
      {t:'6. Tôi có xu hướng phản ứng thái quá với tình huống / I tended to over-react to situations', opts:OPT_DASS, sub:'stress'},
      {t:'7. Tôi cảm thấy run rẩy (ví dụ: ở tay) / I experienced trembling (e.g. in the hands)', opts:OPT_DASS, sub:'anxiety'},
      {t:'8. Tôi cảm thấy mình đang sử dụng rất nhiều năng lượng thần kinh / I felt that I was using a lot of nervous energy', opts:OPT_DASS, sub:'stress'},
      {t:'9. Tôi lo lắng về những tình huống mà tôi có thể hoảng loạn và làm mình bẽ mặt / I was worried about situations in which I might panic and make a fool of myself', opts:OPT_DASS, sub:'anxiety'},

/* =========================================================
   STATE & STORAGE
========================================================= */
let patients = [];
let timelines = {};   // patientId -> array
let scaleData = {};   // patientId -> array
let activePatientId = null;
let activeTab = 'overview';
let searchQuery = '';
let clinicFilter = 'all';
let pendingScaleKey = null;
let pendingScaleAnswers = {};

const IDB_NAME = 'psychiatry_offline_v1';
const IDB_STORE = 'kv';
function openIDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function storageGet(key){
  try{
    const db=await openIDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(key);
      req.onsuccess=()=>resolve(req.result ?? null);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){ console.error('storage get failed',key,e); return null; }
}
async function storageSet(key,value){
  const db=await openIDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function storageClear(){
  const db=await openIDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

async function init(){
  let stored = await storageGet('patients_v1');
  if(!stored){
    patients = SEED_PATIENTS.map(p=>({...p}));
    await storageSet('patients_v1', patients);
  } else {
    patients = stored;
  }
  renderSidebar();
  renderMain();
  if(!patients.length){
    setTimeout(()=>toast('Chưa có dữ liệu — bấm “Nhập dữ liệu” để bắt đầu'),300);
  }
}

async function loadPatientExtras(pid){
  if(!(pid in timelines)){
    timelines[pid] = (await storageGet('timeline_'+pid)) || [];
  }
  if(!(pid in scaleData)){
    const stored = (await storageGet('scales_'+pid)) || [];
    const seed = SEED_DASS21[pid] || [];
    const existingKeys = new Set(stored.map(s=> s.scaleKey+'|'+s.date));
    const toAdd = seed.filter(s=> !existingKeys.has(s.scaleKey+'|'+s.date));
    scaleData[pid] = stored.concat(toAdd);
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderClinicFilter(){
  const holder = document.getElementById('clinic-filter');
  const pills = [{v:'all', l:'Tất cả'}, ...CLINICS.map(c=>({v:c,l:c}))];
  holder.innerHTML = pills.map(p=>
    `<div class="clinic-pill ${clinicFilter===p.v?'active':''}" data-v="${escAttr(p.v)}">${esc(p.l)}</div>`
  ).join('');
  holder.querySelectorAll('.clinic-pill').forEach(el=>{
    el.addEventListener('click', ()=>{
      clinicFilter = el.dataset.v;
      renderSidebar();
    });
  });
}

function renderSidebar(){
  const list = document.getElementById('patient-list');
  const q = searchQuery.trim().toLowerCase();
  const filtered = patients.filter(p=>{
    if(clinicFilter!=='all' && (p.clinic||'').trim() !== clinicFilter) return false;
    if(!q) return true;
    return (p.name||'').toLowerCase().includes(q) || (p.phone||'').includes(q) || (p.id||'').toLowerCase().includes(q);
  }).sort((a,b)=> (a.name||'').localeCompare(b.name||'','vi'));

  renderClinicFilter();
  document.getElementById('patient-count').textContent = filtered.length + ' / ' + patients.length + ' bệnh nhân';

  list.innerHTML = filtered.map(p=>{
    const loaded = scaleData[p.id]||[];
    const seed = SEED_DASS21[p.id]||[];
    const risk = loaded.some(s=>s.riskFlag) || seed.some(s=>s.riskFlag);
    return `<div class="patient-item ${p.id===activePatientId?'active':''}" data-id="${escAttr(p.id)}">
      <div class="pname">${esc(p.name||'(Chưa có tên)')}</div>
      <div class="pmeta">${esc(p.gender||'')}${p.birth?(' · '+p.birth.slice(0,4)):''}${p.clinic?(' · '+esc(p.clinic)):''}</div>
      ${seed.length ? `<span class="pflag" style="background:var(--teal-pale);color:var(--teal-dark);">DASS-21 · ${seed.length} lần</span>` : ''}
      ${risk ? '<span class="pflag">⚠ Cần chú ý</span>' : ''}
    </div>`;
  }).join('') || '<div style="padding:20px;color:var(--ink-soft);font-size:13px;">Không tìm thấy bệnh nhân.</div>';

  list.querySelectorAll('.patient-item').forEach(el=>{
    el.addEventListener('click', async ()=>{
      activePatientId = el.dataset.id;
      activeTab='overview';
      await loadPatientExtras(activePatientId);
      renderSidebar();
      renderMain();
      if(window.innerWidth<=800) document.getElementById('sidebar').classList.remove('open');
    });
  });
}

document.getElementById('search-input').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  renderSidebar();
});

    </div>`;
    return;
  }
  const p = patients.find(x=>x.id===activePatientId);

  main.innerHTML = `
    <button id="mobile-back" class="btn">‹ Danh sách</button>

      <div>
        <div class="ph-title">${esc(p.name||'(Chưa có tên)')}</div>

      <div class="tab ${activeTab==='scales'?'active':''}" data-tab="scales">Thang đo</div>
    </div>
    <div id="tab-content"></div>
  `;
  document.getElementById('mobile-back').addEventListener('click', ()=>document.getElementById('sidebar').classList.add('open'));
  document.getElementById('edit-patient-btn').addEventListener('click', ()=>openAddPatientModal(p));
  document.getElementById('delete-patient-btn').addEventListener('click', ()=>deletePatient(p.id));
  main.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{ activeTab=t.dataset.tab; renderMain(); }));

  if(activeTab==='overview') content.innerHTML = renderOverview(p);

  else if(activeTab==='scales') renderScalesTab(p);

/* ---------- Timeline ---------- */
function renderTimeline(p){
  const c = document.getElementById('tab-content');
  const entries = (timelines[p.id]||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  c.innerHTML = `
    <div style="margin-bottom:14px;">
      <button class="btn btn-primary" id="add-visit-btn">+ Thêm lần khám</button>
    </div>
    <div class="card">
      <h3>Lịch sử tiến trình điều trị</h3>
      ${entries.length===0 ? '<div style="color:var(--ink-soft);font-size:13px;">Chưa có ghi nhận nào.</div>' :
        entries.map((e,i)=>`
        <div class="timeline-entry">
          <div class="timeline-dot-col"><div class="timeline-dot"></div>${i<entries.length-1?'<div class="timeline-line"></div>':''}</div>
          <div class="timeline-body">
            <div class="timeline-date">${esc(e.date)}</div>
            ${e.note ? `<div class="timeline-note">${esc(e.note)}</div>` : ''}
            ${e.medication ? `<div class="timeline-med"><strong>Thuốc/Xử trí:</strong> ${esc(e.medication)}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('add-visit-btn').addEventListener('click', ()=>openAddVisitModal(p));
}

function openAddVisitModal(p){
  openModal(`
    <h2>Thêm lần khám</h2>
    <div class="modal-sub">${esc(p.name)}</div>
    <div class="form-row"><label>Ngày khám</label><input type="date" id="visit-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-row"><label>Ghi chú lâm sàng</label><textarea id="visit-note" placeholder="Diễn tiến, triệu chứng, đánh giá..."></textarea></div>
    <div class="form-row"><label>Thuốc / Xử trí</label><textarea id="visit-med" placeholder="Thuốc kê đơn, liều dùng, hướng xử trí..."></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Hủy</button>
      <button class="btn btn-primary" id="modal-save">Lưu</button>
    </div>
  `);
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const date = document.getElementById('visit-date').value;
    const note = document.getElementById('visit-note').value.trim();
    const medication = document.getElementById('visit-med').value.trim();
    if(!date){ toast('Vui lòng chọn ngày khám'); return; }
    timelines[p.id] = timelines[p.id]||[];
    timelines[p.id].push({date, note, medication, id: Date.now()});
    await storageSet('timeline_'+p.id, timelines[p.id]);
    closeModal();
    renderTimeline(p);
    toast('Đã lưu lần khám');
  });
}

function sparkline(values, color, label){
  const w=560,h=50,pad=6;
  const max = Math.max(...values, 1);
  const min = 0;
  const step = values.length>1 ? (w-2*pad)/(values.length-1) : 0;
  const pts = values.map((v,i)=>{
    const x = pad + i*step;
    const y = h-pad - ( (v-min)/(max-min||1) ) * (h-2*pad);
    return `${x},${y}`;
  }).join(' ');
  const dots = values.map((v,i)=>{
    const x = pad + i*step;
    const y = h-pad - ( (v-min)/(max-min||1) ) * (h-2*pad);
    return `<circle cx="${x}" cy="${y}" r="2.6" fill="${color}"/>`;
  }).join('');
  return `<div style="font-size:11px;color:var(--ink-soft);margin-bottom:2px;">${label} (mới nhất: ${values[values.length-1]})</div>
  <svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function formatShortDate(d){
  const parts = (d||'').split('-');
  return parts.length===3 ? `${parts[2]}/${parts[1]}` : (d||'');
}

const DASS_ZONE_COLORS = ['#dcebde','#f6e8c9','#f8d9b8','#f3cac4','#e3b3ac'];
const DASS_ZONE_LABELS = ['Bình thường','Nhẹ','Trung bình','Nặng','Rất nặng'];

function dassTrendChart(arr, subKey, label, abbr, thresholds, color){
  const values = arr.map(a=>a.subScores[subKey]);
  const dates = arr.map(a=>a.date);
  const w=620, h=136, padL=6, padR=6, padT=10, padB=30;
  const innerH = h-padT-padB, innerW = w-padL-padR;
  const bandEdges = thresholds.map(t=>t[0]);
  const realMax = bandEdges[bandEdges.length-2];
  const visualMax = Math.max(...values, realMax) * 1.12;
  const y = v => padT + innerH * (1 - Math.min(v, visualMax)/visualMax);

  let lower = 0, bandsSvg = '';
  thresholds.forEach((t,i)=>{
    const upper = Math.min(t[0], visualMax);
    const yTop = y(upper), yBottom = y(lower);
    bandsSvg += `<rect x="${padL}" y="${yTop}" width="${innerW}" height="${Math.max(yBottom-yTop,0)}" fill="${DASS_ZONE_COLORS[i]}"/>`;
    lower = t[0];
  });

  const stepX = values.length>1 ? innerW/(values.length-1) : 0;
  const pts = values.map((v,i)=>`${padL+i*stepX},${y(v)}`).join(' ');
  const dots = values.map((v,i)=>`<circle cx="${padL+i*stepX}" cy="${y(v)}" r="3.6" fill="${color}" stroke="#fff" stroke-width="1.4"/>`).join('');
  const anchorFor = (i)=> i===0 ? 'start' : (i===values.length-1 ? 'end' : 'middle');
  const valLabels = values.map((v,i)=>`<text x="${padL+i*stepX}" y="${y(v)-8}" font-size="10" font-weight="700" fill="${color}" text-anchor="${anchorFor(i)}">${v}</text>`).join('');
  const dateLabels = dates.map((d,i)=>`<text x="${padL+i*stepX}" y="${h-8}" font-size="9.5" fill="var(--ink-soft)" text-anchor="${anchorFor(i)}">${formatShortDate(d)}</text>`).join('');
  const lastLevel = levelFor(thresholds, values[values.length-1]);

  return `<div style="margin-bottom:18px;">
    <div style="font-size:12px;color:var(--ink);font-weight:700;margin-bottom:4px;">
      ${label} <span style="color:var(--ink-soft);font-weight:500;">(${abbr})</span> — mới nhất: ${values[values.length-1]}
      <span class="level-pill lv-${lastLevel.lvl}" style="margin-left:6px;">${lastLevel.label}</span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px;display:block;" preserveAspectRatio="none">
      ${bandsSvg}
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4"/>
      ${dots}
      ${valLabels}
      ${dateLabels}
    </svg>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
      ${DASS_ZONE_LABELS.map((zl,i)=>`<span style="font-size:10px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;"><span style="width:9px;height:9px;border-radius:2px;background:${DASS_ZONE_COLORS[i]};display:inline-block;border:1px solid rgba(0,0,0,0.12);"></span>${zl}</span>`).join('')}
    </div>
  </div>`;
}

function computeYbocsResult(scale, pending, date){
  const sumPart = (obj, len)=>{ let s=0; for(let i=0;i<len;i++) s += (obj[i]||0); return s; };
  const obsessions = sumPart(pending.B, scale.partB.length);
  const compulsions = sumPart(pending.D, scale.partD.length);
  const total = obsessions + compulsions;
  const level = levelFor(scale.levels, total);
  const checkedA = Object.keys(pending.A).filter(k=>pending.A[k]===1).map(Number);
  const checkedC = Object.keys(pending.C).filter(k=>pending.C[k]===1).map(Number);
  return {
    scaleKey:'ybocs2', date,
    subScores:{obsessions, compulsions}, total, level,
    checkedObsessions: checkedA, checkedCompulsions: checkedC,
    answersB:{...pending.B}, answersD:{...pending.D},
    riskFlag:false, id:Date.now()
  };
}

function levelFor(levels, score){
  for(const [max,label,lvl] of levels){
    if(score<=max) return {label,lvl};
  }
  return {label:levels[levels.length-1][1], lvl:levels[levels.length-1][2]};
}

function computeScaleResult(scale, answers, date){
  let riskFlag = false;
  scale.items.forEach((it,idx)=>{ if(it.risk && answers[idx]>0) riskFlag = true; });

  if(scale.subscale){
    const subScores = {depression:0, anxiety:0, stress:0};
    scale.items.forEach((it,idx)=>{ subScores[it.sub] += (answers[idx]||0); });
    Object.keys(subScores).forEach(k=> subScores[k] = subScores[k]*2 );
    const subLevels = {
      depression: levelFor(scale.subLevels.depression, subScores.depression),
      anxiety: levelFor(scale.subLevels.anxiety, subScores.anxiety),
      stress: levelFor(scale.subLevels.stress, subScores.stress)
    };
    return {scaleKey:scale.key, date, answers:{...answers}, subScores, subLevels, riskFlag, id:Date.now()};
  }

  const total = Object.values(answers).reduce((a,b)=>a+b,0);
  const level = levelFor(scale.levels, total);
  return {scaleKey:scale.key, date, answers:{...answers}, total, level, riskFlag, id:Date.now()};
}

/* ---------- CAARS-S:S — điểm thô, Inconsistency Index, nhóm chuẩn, diễn giải T-score ---------- */
function ageAt(birthStr, dateStr){
  if(!birthStr) return null;
  const b = new Date(birthStr), d = new Date(dateStr||new Date());
  if(isNaN(b.getTime())) return null;
  let age = d.getFullYear() - b.getFullYear();
  const m = d.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && d.getDate() < b.getDate())) age--;
  return age;
}

function caarsNormGroup(gender, age){
  if(age==null) return {label:'Không rõ tuổi bệnh nhân (chưa có ngày sinh trong hồ sơ) — cần biết tuổi để xác định nhóm chuẩn khi tra T-score.', group:null};
  if(age<18) return {label:`${age} tuổi — dưới 18, ngoài phạm vi chuẩn hóa người lớn của CAARS-S:S.`, group:null};
  let bin, bandLabel;
  if(age<=29){ bin=1; bandLabel='18–29'; }
  else if(age<=39){ bin=2; bandLabel='30–39'; }
  else if(age<=49){ bin=3; bandLabel='40–49'; }
  else { bin=4; bandLabel='≥50'; }
  const sexLetter = gender==='Nam' ? 'M' : (gender==='Nữ' ? 'F' : null);
  if(!sexLetter) return {label:`${age} tuổi (nhóm tuổi ${bandLabel}) — chưa rõ giới tính trong hồ sơ, cần chọn cột M hoặc F phù hợp khi tra T-score.`, group:null, bandLabel};
  const group = sexLetter+bin;
  return {label:`${gender}, ${age} tuổi → nhóm chuẩn ${group} (${bandLabel}) — dùng nhóm này khi tra bảng T-score trong manual CAARS-S:S.`, group, bandLabel};
}

function tscoreInterpret(t){
  if(t===null || t===undefined || t==='' || isNaN(t)) return null;
  t = Number(t);
  if(t>70) return 'Rất cao / Very much above average';
  if(t>=66) return 'Cao / Much above average';
  if(t>=61) return 'Trên trung bình / Above average';
  if(t>=56) return 'Hơi trên trung bình / Slightly above average';
  if(t>=45) return 'Trung bình / Average';
  if(t>=40) return 'Hơi dưới trung bình / Slightly below average';
  if(t>=35) return 'Dưới trung bình / Below average';
  if(t>=30) return 'Thấp / Much below average';
  return 'Rất thấp / Very much below average';
}

function caarsRawScores(scale, answers){
  const sum = idxArr => idxArr.reduce((s,i)=> s+(answers[i]||0), 0);
  const scores = {};
  ['A','B','C','D','E'].forEach(k=>{ scores[k] = sum(scale.subscales[k].items); });
  scores.inconsistency = scale.inconsistencyPairs.reduce((s,[i,j])=> s+Math.abs((answers[i]||0)-(answers[j]||0)), 0);
  return scores;
}

function computeCaarsResult(scale, answers, date, p){
  const scores = caarsRawScores(scale, answers);
  const age = ageAt(p.birth, date);
  const norm = caarsNormGroup(p.gender, age);
  return {
    scaleKey:'caars', date, answers:{...answers},
    rawScores:{A:scores.A, B:scores.B, C:scores.C, D:scores.D, E:scores.E},
    inconsistency:scores.inconsistency,
    ageAtAssessment:age, normGroup:norm.group, normLabel:norm.label,
    tscores:{A:null,B:null,C:null,D:null,E:null},
    riskFlag:false, id:Date.now()
  };
}

async function cleanEmptyPatients(){
  if(!patients.length){ toast('Chưa có bệnh nhân nào'); return; }
  toast('Đang quét dữ liệu...');
  const emptyList = [];
  for(const p of patients){
    const tl = (await storageGet('timeline_'+p.id)) || [];
    const sc = (await storageGet('scales_'+p.id)) || [];
    if(tl.length===0 && sc.length===0) emptyList.push(p);
  }
  if(!emptyList.length){ alert('Không có bệnh nhân nào trống dữ liệu tiến trình điều trị và thang đo.'); return; }
  const preview = emptyList.slice(0,30).map(p=>p.name).join('\n') + (emptyList.length>30 ? `\n… và ${emptyList.length-30} bệnh nhân khác` : '');
  if(!confirm(`Tìm thấy ${emptyList.length} bệnh nhân chưa có tiến trình điều trị và chưa làm thang đo nào:\n\n${preview}\n\nXóa toàn bộ ${emptyList.length} bệnh nhân này? Nên có bản backup trước khi xóa — hành động này không thể hoàn tác.`)) return;
  const emptyIds = new Set(emptyList.map(p=>p.id));
  patients = patients.filter(p=>!emptyIds.has(p.id));
  await storageSet('patients_v1', patients);
  emptyList.forEach(p=>{ delete timelines[p.id]; delete scaleData[p.id]; });
  if(activePatientId && emptyIds.has(activePatientId)) activePatientId = null;
  renderSidebar();
  renderMain();
  toast(`Đã xóa ${emptyList.length} bệnh nhân trống dữ liệu`);
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }


/* =========================================================
   OFFLINE PWA / IMPORT / ENCRYPTED BACKUP
========================================================= */
function bytesToB64(bytes){
  let s=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) s+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(s);
}
function b64ToBytes(s){
  const bin=atob(s); const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function deriveBackupKey(password,salt){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function collectAllData(){
  const p=(await storageGet('patients_v1'))||[];
  const t={}; const s={};
  for(const patient of p){
    const pid=patient.id;
    const tv=await storageGet('timeline_'+pid); if(tv?.length) t[pid]=tv;
    const sv=await storageGet('scales_'+pid); if(sv?.length) s[pid]=sv;
  }
  return {format:'PsychiatryOfflineBackup',version:1,createdAt:new Date().toISOString(),patients:p,timelines:t,scales:s};
}
function downloadBlob(blob,filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function encryptedBackup(){
  const password=prompt('Nhập mật khẩu cho file backup (ít nhất 8 ký tự):');
  if(!password) return;
  if(password.length<8){ alert('Mật khẩu phải có ít nhất 8 ký tự.'); return; }
  const confirmPw=prompt('Nhập lại mật khẩu backup:');
  if(password!==confirmPw){ alert('Hai mật khẩu không giống nhau.'); return; }
  const data=await collectAllData();
  const plain=new TextEncoder().encode(JSON.stringify(data));
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveBackupKey(password,salt);
  const encrypted=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
  const pack={format:'PsychiatryEncryptedBackup',version:1,kdf:'PBKDF2-SHA256',iterations:250000,cipher:'AES-256-GCM',salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(encrypted)};
  const d=new Date().toISOString().slice(0,10);
  downloadBlob(new Blob([JSON.stringify(pack)],{type:'application/json'}),`Psychiatry-backup-${d}.psybackup`);
  toast('Đã tạo backup mã hóa');
}
async function restoreEncryptedFile(file){
  let pack;
  try{ pack=JSON.parse(await file.text()); }catch{ alert('File không hợp lệ.'); return; }
  if(pack.format!=='PsychiatryEncryptedBackup'){ alert('Đây không phải file backup mã hóa của Psychiatry.'); return; }
  const password=prompt('Nhập mật khẩu của file backup:'); if(!password) return;
  try{
    const salt=b64ToBytes(pack.salt), iv=b64ToBytes(pack.iv), enc=b64ToBytes(pack.data);
    const key=await deriveBackupKey(password,salt);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,enc);
    const data=JSON.parse(new TextDecoder().decode(plain));
    if(!confirm(`Khôi phục ${data.patients?.length||0} bệnh nhân? Dữ liệu hiện tại sẽ bị thay thế.`)) return;
    await storageClear();
    await storageSet('patients_v1',data.patients||[]);
    for(const [pid,arr] of Object.entries(data.timelines||{})) await storageSet('timeline_'+pid,arr);
    for(const [pid,arr] of Object.entries(data.scales||{})) await storageSet('scales_'+pid,arr);
    alert('Khôi phục thành công. App sẽ tải lại.'); location.reload();
  }catch(e){ console.error(e); alert('Không giải mã được. Kiểm tra lại mật khẩu hoặc file backup.'); }
}
async function importSeedFile(file){
  let data;
  try{ data=JSON.parse(await file.text()); }catch{ alert('Không đọc được file JSON.'); return; }
  if(data.format!=='PsychiatryOfflineSeed' || !Array.isArray(data.patients)){
    alert('File không đúng định dạng PsychiatryOfflineSeed.'); return;
  }
  const existing=(await storageGet('patients_v1'))||[];
  if(existing.length && !confirm(`App hiện có ${existing.length} bệnh nhân. Nhập file này sẽ thay thế dữ liệu hiện tại. Tiếp tục?`)) return;
  await storageClear();
  await storageSet('patients_v1',data.patients);
  for(const [pid,arr] of Object.entries(data.dass21||{})) await storageSet('scales_'+pid,arr);
  alert(`Đã nhập ${data.patients.length} bệnh nhân và ${Object.values(data.dass21||{}).reduce((n,a)=>n+a.length,0)} lần DASS-21. App sẽ tải lại.`);
  location.reload();
}
function wireOfflineControls(){
  const imp=document.getElementById('import-data-btn');
  const inf=document.getElementById('import-file');
  const bak=document.getElementById('backup-data-btn');
  const res=document.getElementById('restore-data-btn');
  const ref=document.getElementById('restore-file');
  const cln=document.getElementById('clean-empty-btn');
  if(imp&&inf){ imp.onclick=()=>inf.click(); inf.onchange=()=>{ if(inf.files[0]) importSeedFile(inf.files[0]); }; }
  if(bak) bak.onclick=()=>encryptedBackup();
  if(res&&ref){ res.onclick=()=>ref.click(); ref.onchange=()=>{ if(ref.files[0]) restoreEncryptedFile(ref.files[0]); }; }
  if(cln) cln.onclick=()=>cleanEmptyPatients();
}
wireOfflineControls();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW',e)));
}

init();
</script>
